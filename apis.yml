aid: sirona
name: Sirona Medical
description: >-
  Sirona Medical builds RadOS, the Radiology Operating System — a cloud-native
  platform that replaces the fragmented legacy radiology IT stack (separate PACS,
  reporter, diagnostic viewer, and worklist) with one integrated, browser-based
  system for radiologists and radiology practices. The platform unifies DICOM
  imaging, structured reports, worklist state, clinical context, and live events
  behind a single data layer, adds platform AI (auto-impressions, hanging
  protocols, quality assist, and orchestration of third-party FDA-cleared
  algorithms), and integrates via managed DICOM, HL7, and FHIR. It is an FDA
  Class I device platform, SOC 2 Type II certified for six consecutive years,
  and HIPAA compliant. A public developer surface (the RadOS/Amplify SDK plus a
  GraphQL API) is announced as on the roadmap; no shipped public API exists yet.
  Backed by 8vc.
